spring:
  application:
    name: mailing-service
  profiles:
    active: mock
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false
  kafka:
    consumer:
      group-id: mailing-service

mailing:
  repository-mode: mock
  max-send-attempts: 5
  retry:
    base-delay-seconds: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

